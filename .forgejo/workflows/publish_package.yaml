name: Publish Nuget

on: 
  push:
    tags:
      - 'v*.*.*' # Triggers only when you push a version tag like v1.0.0
jobs:
  publish:
    runs-on: docker
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v7
      
      - name: Setup .NET SDK  
        uses: actions/setup-dotnet@v6
        with:
            dotnet-version: '10.0.x'
     
      - name: Restore Dependencies
        run: dotnet restore